name: Experiment
description: Test a removable hypothesis with a baseline and fallback
title: "[EXPERIMENT] "
labels: ["experiment"]
body:
  - type: textarea
    id: phase
    attributes:
      label: Active-phase authorization and isolation
      description: Explain why this experiment is allowed now and how it remains outside the productive critical path.
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis and causal mechanism
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline, scenario and controls
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gate profile and protected invariants
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics, limits and expected evidence
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: Removal, fallback and promotion decision
    validations:
      required: true
