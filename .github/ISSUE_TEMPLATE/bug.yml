name: Bug
description: Report a reproducible defect or regression
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and violated invariant
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction, seed, build and environment
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Authority, realism and performance impact
      description: Explain competitive-state impact and any measurable cost or regression.
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gate profile and regression tests
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, hashes and other evidence
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Risk and rollback
    validations:
      required: true
