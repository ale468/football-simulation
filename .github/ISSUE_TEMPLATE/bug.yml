name: Bug
description: Report a reproducible defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and invariant
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction, seed, build and environment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, hashes and other evidence
    validations:
      required: true

